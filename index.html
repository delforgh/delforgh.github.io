<title>Delfín van Peborgh</title>
<meta name="description" content="Delfín van Peborgh — Pileta Libre, Panorámicas, Pieles, Google Earth, Mitologías Digitales">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@500;700;800&family=Karla:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F7F7F4; --ink:#151514; --mute:#6F6F6A; --line:#DEDED8; --acc:#1E5FC2; --tile:#ECECE7; --feed:#0B0B0C;
  --fd:"Syne","Helvetica Neue",Arial,sans-serif;
  --fb:"Karla","Helvetica Neue",Arial,sans-serif;
  --fm:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#101113; --ink:#ECECE7; --mute:#8D8D88; --line:#2A2B2E; --acc:#5E96F2; --tile:#1A1B1E; --feed:#000; }
}
:root[data-theme="dark"]{ --bg:#101113; --ink:#ECECE7; --mute:#8D8D88; --line:#2A2B2E; --acc:#5E96F2; --tile:#1A1B1E; --feed:#000; }

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
img,video{max-width:100%;display:block}
button{font:inherit;color:inherit}

/* shell */
.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.index{position:sticky;top:0;align-self:start;height:100vh;padding:28px 20px 28px 28px;display:flex;flex-direction:column;gap:34px;border-right:1px solid var(--line)}
.brand{font-family:var(--fd);font-weight:800;font-size:17px;letter-spacing:.01em;line-height:1.15;text-transform:uppercase;position:relative;padding-right:26px}
.brand .home{position:absolute;right:0;top:1px;width:18px;height:18px;color:var(--mute)}
.brand .home:hover{color:var(--acc)}
.brand .home svg{width:18px;height:18px;display:block}
.brand span{display:block;font-weight:500;font-size:11px;letter-spacing:.14em;color:var(--mute);margin-top:6px;font-family:var(--fm);text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:22px}
.nav h6{margin:0 0 8px;font:500 10.5px/1 var(--fm);letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.nav ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.nav a{font-family:var(--fd);font-weight:500;font-size:15px;display:inline-block;padding:1px 0;border-bottom:1px solid transparent}
.nav a:hover{color:var(--acc)}
.nav a.on{color:var(--acc);border-bottom-color:var(--acc)}
.foot{margin-top:auto;font:400 11px/1.6 var(--fm);color:var(--mute);letter-spacing:.04em}
.foot a:hover{color:var(--acc)}
main{padding:28px 40px 80px;min-width:0}
.topbar{display:none}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .index{display:none}
  .topbar{display:block;position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:14px 16px 10px}
  .topbar .brand{font-size:15px;display:inline-block}
  .tnav{display:flex;gap:16px;overflow-x:auto;margin-top:10px;padding-bottom:4px;scrollbar-width:none}
  .tnav::-webkit-scrollbar{display:none}
  .tnav a{white-space:nowrap;font-family:var(--fd);font-weight:500;font-size:14px;border-bottom:1px solid transparent}
  .tnav a.on{color:var(--acc);border-bottom-color:var(--acc)}
  main{padding:20px 16px 60px}
}

/* home */
.hero{position:relative;width:min(100%,calc((86vh - 40px)*0.89));aspect-ratio:1000/1120;margin:0 auto;overflow:hidden;background:#FAFAFB}
.hero .ph,.hero .cut{position:absolute;left:0;bottom:0;width:100%;height:auto;aspect-ratio:1/1;object-fit:contain;pointer-events:none}
.hero svg{position:absolute;inset:0;width:100%;height:100%}
.hero svg text{font-family:var(--fd);font-weight:800;fill:#111;text-transform:uppercase}
.hero .meta{position:absolute;left:2%;bottom:2%;font:400 11px/1.7 var(--fm);letter-spacing:.06em;color:var(--mute);text-transform:uppercase}
.band{margin-top:28px;display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.band .tile{position:relative;aspect-ratio:3/4;overflow:hidden;background:var(--tile);display:block}
.band .tile .ly{position:absolute;inset:0;background-size:cover;background-position:center;background-repeat:no-repeat;opacity:0;transition:opacity .7s ease}
.band .tile .ly.show{opacity:1}
.band .tile video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.band .tile .tag{position:absolute;left:8px;bottom:8px;font:500 10px/1 var(--fm);letter-spacing:.12em;text-transform:uppercase;color:#fff;background:rgba(0,0,0,.55);padding:5px 7px}
@media (max-width:900px){.band{grid-template-columns:repeat(3,1fr);gap:6px;margin-top:22px}.hero{width:100%}}
@media (max-width:560px){.band{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:reduce){.band .tile .ly{transition:none}}
.serieslist{margin-top:56px;border-top:1px solid var(--line)}
.serieslist a{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:baseline;padding:14px 0;border-bottom:1px solid var(--line);font-family:var(--fd);font-weight:700;font-size:clamp(20px,2.4vw,30px);text-transform:uppercase;letter-spacing:-.005em}
.serieslist a small{font:400 11px/1 var(--fm);letter-spacing:.1em;color:var(--mute);text-transform:uppercase}
.serieslist a:hover{color:var(--acc)}

/* series */
.head{max-width:900px;margin-bottom:30px}
.eyebrow{font:500 10.5px/1 var(--fm);letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin:6px 0 14px}
.head h1{font-family:var(--fd);font-weight:800;font-size:clamp(32px,5vw,64px);line-height:.95;letter-spacing:-.015em;margin:0 0 14px;text-transform:uppercase;text-wrap:balance}
.head p{margin:0;max-width:62ch;font-size:15.5px;line-height:1.55;color:var(--mute)}

/* reading-order masonry */
.masonry{display:flex;gap:14px;align-items:flex-start}
.masonry .col{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:22px}
.masonry figure{margin:0}
.masonry img{width:100%;height:auto;background:var(--tile);cursor:zoom-in}
.masonry figcaption{font:400 11px/1.5 var(--fm);letter-spacing:.06em;color:var(--mute);margin-top:7px;text-transform:uppercase}

.chapter{margin-top:56px;padding-top:26px;border-top:1px solid var(--line)}
.chapter h2{font-family:var(--fd);font-weight:700;font-size:clamp(22px,3vw,36px);text-transform:uppercase;letter-spacing:-.01em;margin:0 0 10px;line-height:1}
.chapter p{margin:0 0 20px;max-width:62ch;font-size:15.5px;line-height:1.55;color:var(--mute)}

/* video block */
.vidblock{margin:40px auto 0;max-width:980px}
.solo{margin:40px auto 0;max-width:min(60%,620px)}
.solo img{width:100%;height:auto;cursor:zoom-in;background:var(--tile)}
.solo figcaption{font:400 11px/1.5 var(--fm);letter-spacing:.06em;color:var(--mute);margin-top:7px;text-transform:uppercase}
.vidblock video{width:100%;height:auto;background:#000}
.vidblock figcaption{font:400 11px/1.5 var(--fm);letter-spacing:.06em;color:var(--mute);margin-top:7px;text-transform:uppercase}
.vidblock a{border-bottom:1px solid var(--line)}
.vidblock a:hover{color:var(--acc)}

/* void */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.chips button{border:1px solid var(--line);background:transparent;padding:6px 10px;font:500 10.5px/1 var(--fm);letter-spacing:.12em;text-transform:uppercase;cursor:pointer;color:var(--mute)}
.chips button.on{color:var(--ink);border-color:var(--ink)}
.chips button:hover{color:var(--acc);border-color:var(--acc)}
.void{position:relative;height:calc(100vh - 40px);min-height:520px;overflow:hidden;background:var(--bg);border-top:1px solid var(--line);border-bottom:1px solid var(--line);cursor:crosshair}
.void .field{position:absolute;left:0;top:0;will-change:transform}
.v{position:absolute;background-repeat:no-repeat;opacity:.78;transform:translate(-50%,-50%);transition:opacity .35s ease, transform .35s ease, -webkit-mask-size .3s ease;cursor:pointer;-webkit-mask-image:radial-gradient(ellipse at center,#000 40%,transparent 72%);mask-image:radial-gradient(ellipse at center,#000 40%,transparent 72%);-webkit-mask-size:100% 100%;mask-size:100% 100%}
.v .s{position:absolute;inset:0;background-repeat:no-repeat;opacity:0;transition:opacity .25s ease}
.v:hover,.v.on{opacity:1;z-index:20;transform:translate(-50%,-50%) scale(var(--hs,2.2));-webkit-mask-image:none;mask-image:none}
.v:hover .s,.v.on .s{opacity:1}
.v.hide{display:none}
.void .hint{position:absolute;right:14px;bottom:10px;font:400 10.5px/1 var(--fm);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);pointer-events:none}
@media (hover:none){.void{overflow:auto;cursor:default}.void .field{position:relative}.v{opacity:.85}}
@media (prefers-reduced-motion:no-preference){
  .v{animation:drift var(--dur,18s) ease-in-out infinite alternate}
  @keyframes drift{from{margin-top:0;margin-left:0}to{margin-top:var(--dy,10px);margin-left:var(--dx,-10px)}}
}

/* feed */
.feed{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;background:var(--feed);padding:3px}
.feed .cell{aspect-ratio:1/1;overflow:hidden;background:#000}
.feed video{width:100%;height:100%;object-fit:cover}
@media (max-width:1300px){.feed{grid-template-columns:repeat(4,1fr)}}
@media (max-width:900px){.feed{grid-template-columns:repeat(3,1fr)}}
@media (max-width:560px){.feed{grid-template-columns:repeat(2,1fr)}}

/* info */
.info{max-width:62ch}
.info h1{font-family:var(--fd);font-weight:800;font-size:clamp(28px,4vw,48px);text-transform:uppercase;line-height:1;margin:0 0 22px}
.info p{margin:0 0 14px;font-size:17px}
.info dl{margin:22px 0 0;display:grid;grid-template-columns:max-content 1fr;gap:8px 22px;font-size:15px}
.info dt{font:500 10.5px/1.9 var(--fm);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.info dd{margin:0}
.info dd a{border-bottom:1px solid var(--line)}
.info dd a:hover{color:var(--acc);border-bottom-color:var(--acc)}
.statement{margin-top:44px;max-width:62ch}
.statement h2,.cv h2{font:500 10.5px/1 var(--fm);letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin:26px 0 12px;padding-top:12px;border-top:1px solid var(--line)}
.statement p{margin:0 0 12px;font-size:16px}
.cv{margin-top:20px;max-width:62ch}
.cv h2{font:500 10.5px/1 var(--fm);letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin:26px 0 10px;padding-top:12px;border-top:1px solid var(--line)}
.cv ul{list-style:none;margin:0;padding:0}
.cv li{display:grid;grid-template-columns:60px 1fr;gap:14px;padding:4px 0;font-size:15px}
.cv li span{font:400 12px/1.9 var(--fm);color:var(--mute)}
.cv .todo{color:var(--mute);font-style:italic}

/* lightbox */
.lb{position:fixed;inset:0;background:rgba(8,8,9,.96);display:none;z-index:50;align-items:center;justify-content:center}
.lb.open{display:flex}
.lb img{max-width:min(96vw,1600px);max-height:92vh;width:auto;height:auto;object-fit:contain}
.lb .cap{position:absolute;left:18px;bottom:14px;font:400 11px/1.5 var(--fm);letter-spacing:.08em;text-transform:uppercase;color:#bdbdb8}
.lb .x{position:absolute;top:12px;right:16px;background:none;border:0;color:#fff;font:400 13px/1 var(--fm);letter-spacing:.1em;cursor:pointer;padding:8px}
.lb .arr{position:absolute;top:0;bottom:0;width:30%;border:0;background:transparent;cursor:pointer}
.lb .arr.l{left:0}.lb .arr.r{right:0}
</style>

}

/* masonry that keeps reading order: item i goes to the shortest column */
function masonryHTML(list, key, cols){
  const n = innerWidth<640 ? 1 : innerWidth<1200 ? Math.min(2,cols) : cols;
  const h = Array(n).fill(0), colsHTML = Array.from({length:n},()=>[]);
  list.forEach((e,i)=>{
    let c=0; for(let k=1;k<n;k++) if(h[k]<h[c]-0.01) c=k;
    colsHTML[c].push(`<figure><img src="${e.src}" width="${e.w}" height="${e.h}" loading="lazy" decoding="async" alt="${esc(e.cap||key)}" data-lb="${key}:${i}">${e.cap?`<figcaption>${esc(e.cap)}</figcaption>`:''}</figure>`);
    h[c]+= e.h/e.w + (e.cap?0.06:0) + 0.03;
  });
  return `<div class="masonry">${colsHTML.map(c=>`<div class="col">${c.join('')}</div>`).join('')}</div>`;
}

function voidHTML(groups, id){

function seriesHTML(s){
  let body='';
  if (s.kind==='feed'){
    body = `<div class="feed" id="feed">${D.mito.map(p=>Array.from({length:p.n},(_,k)=>`<div class="cell"><video src="${p.p}" muted playsinline preload="none" data-s="${k*5.5}" data-e="${k*5.5+5}"></video></div>`).join('')).join('')}</div>`;
  } else if (s.kind==='void'){
    body = voidHTML(s.groups,'void-'+s.key);
  } else {
    if (s.solo){ const L=D[s.key]; body = masonryHTML(L.slice(0,-1), s.key, s.cols) + `<figure class="solo"><img src="${L.at(-1).src}" width="${L.at(-1).w}" height="${L.at(-1).h}" alt="${L.at(-1).cap}" data-lb="${s.key}:${L.length-1}" loading="lazy"><figcaption>${L.at(-1).cap}</figcaption></figure>`; }
    else body = masonryHTML(D[s.key], s.key, s.cols);
    if (s.voidGroups) body += `<section class="chapter"><h2>${s.voidTitle}</h2>${voidHTML(s.voidGroups,'void-'+s.key)}</section>`;
    if (s.video) body += `<figure class="vidblock"><video src="${s.video.src}" controls playsinline preload="metadata"></video><figcaption>${s.video.cap} <a href="${s.video.ext}" target="_blank" rel="noopener">Ver en Vimeo →</a></figcaption></figure>`;
  }
  return `<header class="head"><div class="eyebrow">Serie</div><h1>${s.name}</h1><p>${s.intro}</p></header>${body}`;
}

function infoHTML(){
  return `<section class="info"><h1>Info</h1>
  <p class="bio">Artista visual y arquitecto (Buenos Aires, 1994). Trabaja entre Barcelona y Buenos Aires.</p>
  <dl><dt>Email</dt><dd><a href="mailto:delforgh@gmail.com">delforgh@gmail.com</a></dd>
      <dt>Instagram</dt><dd><a href="https://instagram.com/delfinvanpeborgh" target="_blank" rel="noopener">@delfinvanpeborgh</a></dd>
      <dt>CV</dt><dd><a href="files/CV_DelfinVanPeborgh.pdf" target="_blank" rel="noopener">Descargar PDF</a></dd></dl>
  <div class="statement" id="statement">
    <h2>Statement</h2>
    <p>Delfín, como el animal. Siempre tuve que aclarar. Sí, de verdad.</p>
    <p>Soy artista y arquitecto. Nací en Buenos Aires en 1994 y crecí entre pantallas, con un nombre que nunca terminó de encajar. Creo que trabajo desde ahí, desde lo que no encaja del todo, desde lo que queda cuando algo se corre un poco de su lugar y ya no es lo que era.</p>
    <p>Todo empezó en una pileta. De chico, en las clases de natación, había un día de pileta libre: nos soltaban entre flotadores de colores a jugar sin reglas. Era divertido y también oscuro. El fondo era profundo, la pileta nos quedaba grande, y el riesgo de hundirse estaba siempre. Salíamos salvajemente a explorarla. De ahí saqué el nombre de mi mundo.</p>
    <p>Durante años pasé el mundo por la pantalla. Recorría mi país entero por Google Earth, rompía la herramienta a propósito, buscaba el error porque en el error aparecía algo vivo, algo que la máquina no controlaba. Me gustaba forzar las cosas para que fallaran lindo. Sin darme cuenta, siempre estuve haciendo lo mismo: agarrar algo y correrlo de lugar hasta que se volviera otra cosa.</p>
    <p>Ahora el movimiento se dio vuelta. Lo que antes subía a la pantalla hoy lo bajo a la mano: al grabado, al papel teñido con cochinilla, a la escultura. En esa bajada lo digital se ensucia, se vuelve materia, se vuelve cuerpo. Después de tantos años ahí adentro, lo que necesito es poner las manos y aceptar el accidente en el mundo real, no solo en el archivo.</p>
    <p>En mis piletas hay un cuerpo desnudo y frágil apoyado contra la grilla dura de los azulejos. Algo que se moja y algo que resiste. Deseo y vulnerabilidad. El agua limpia y hace renacer, y no es casualidad que me llame Delfín: el agua me devuelve al estado más puro antes de volver al ruido. Creo que hago eso, en el fondo. Me saturo en la pantalla y me tiro al agua a limpiarme. Y lo que sale de ese ida y vuelta es mi obra.</p>
  </div>
  <div class="cv" id="cv">
    <h2>Formación</h2><ul>
      <li><span>2026</span>Fotograbado con María Pujol, Barcelona (en curso).</li>
      <li><span>2026</span>Escultura hiperrealista con Pedro Rodríguez, Madrid (en curso).</li>
      <li><span>2025</span>Pintar el retrato y la figura hoy (pintura al óleo), Escola Massana, Barcelona.</li>
      <li><span>2024–25</span>Taller de pintura al óleo con Josep Maria Cabané, Barcelona.</li>
      <li><span>2019</span>Arte generativo, MALBA Joven, Buenos Aires.</li>
      <li><span>2018</span>Digital Constructivism Lab, Architectural Association Visiting School, Buenos Aires.</li>
      <li><span>2017</span>Intercambio, Master of Architecture and Urban Design, Politecnico di Milano.</li>
      <li><span>2013–20</span>Arquitecto, Universidad Torcuato Di Tella, Buenos Aires.</li></ul>
    <h2>Residencias</h2><ul>
      <li><span>2025</span>Collaborative Prototyping Lab, Medialab Matadero, Madrid.</li></ul>
    <h2>Premios</h2><ul>
      <li><span>2024</span>Mejor Video Pop, Buenos Aires Music Video Festival (BAMV), dirección creativa de los videos de Clara Cava.</li>
      <li><span>2020</span>Premio a la mejor tesis de arquitectura, Universidad Torcuato Di Tella.</li></ul>
    <h2>Muestras</h2><ul>
      <li><span>2021</span>Muestra colectiva, La Pebeta, Cardales, Buenos Aires. Serie Google Earth.</li></ul>
  </div></section>`;
}

let rot=null, feedObs=null, voidRAF=null;
function render(){
  const h = location.hash.replace(/^#\/?/,'');

  $('#topbar').innerHTML = topHTML(cur);

  if (voidRAF){cancelAnimationFrame(voidRAF);voidRAF=null}
  if (cur==='home'){ m.innerHTML=homeHTML(); startBand(); }
  else if (cur==='info'){ m.innerHTML=infoHTML(); }
  else if (byId[cur]){ m.innerHTML=seriesHTML(byId[cur]); if(byId[cur].kind==='feed') startFeed(); document.querySelectorAll('.void').forEach(startVoid); }
  else { location.hash='#/'; return; }
  document.title = cur==='home' ? 'Delfín van Peborgh' : `${cur==='info'?'Info':byId[cur].name} — Delfín van Peborgh`;
  window.scrollTo(0,0);
}

/* one tile per series; each cycles its own images, faster on hover */
const ATLW = VD.cell*VD.per;
function poolFor(key){
  if (key==='pano') return VD.items.map((it,i)=>({it,i})).filter(x=>x.it[0]<=2).map(x=>x.it);

  return `background-image:url(${e.src})`;
}
function startBand(){

  tiles.forEach((t,ti)=>{
    const key=t.dataset.key;
    if (key==='mito'){

      const pk=D.mito[Math.floor(Math.random()*D.mito.length)]; let seg=Math.floor(Math.random()*pk.n);
      v.src=pk.p; t.insertBefore(v,t.firstChild);
      v.addEventListener('loadedmetadata',()=>{ v.currentTime=seg*5.5; v.play().catch(()=>{}); });
      loopSeg(v,()=>seg*5.5,()=>seg*5.5+5);
      const next=()=>{ seg=(seg+1)%pk.n; v.currentTime=seg*5.5; };
      t._tick=next; return;
    }
    const pool=poolFor(key); if(!pool.length) return;
    let i=Math.floor(Math.random()*pool.length), cur=0; const lys=t.querySelectorAll('.ly');
    const show=()=>{ const ly=lys[cur]; ly.setAttribute('style',bgFor(pool[i])); ly.classList.add('show'); lys[1-cur].classList.remove('show'); cur=1-cur; i=(i+1)%pool.length; };
    show(); t._tick=show;
  });
  if (reduce) return;
  let t0=performance.now(); const speeds=new Map();
  tiles.forEach(t=>{ t.addEventListener('mouseenter',()=>speeds.set(t,450)); t.addEventListener('mouseleave',()=>speeds.set(t,0)); t._next=t0+1800+Math.random()*1800; });
  const loop=now=>{ tiles.forEach(t=>{ if(!t._tick) return; const fast=speeds.get(t); if(now>=t._next){ t._tick(); t._next=now+(fast||3200+Math.random()*1200); } else if(fast&&t._next-now>fast){ t._next=now+fast; } }); rot=requestAnimationFrame(loop); };
  rot=requestAnimationFrame(loop);
}

/* loop one segment of a pack: check every presented frame (rVFC) so the next clip never shows */
function loopSeg(v,S,E){
  const chk=()=>{ const s=S(),e=E(); if(v.currentTime>=e-0.06||v.currentTime<s-0.5){ v.currentTime=s; } };
  if ('requestVideoFrameCallback' in v){ const f=()=>{ chk(); v.requestVideoFrameCallback(f); }; v.requestVideoFrameCallback(f); }
  v.addEventListener('timeupdate',chk);
}
/* video feed: only what is on screen plays */
function startFeed(){
  const vids=[...document.querySelectorAll('#feed video')];
  vids.forEach(v=>{ const s=+v.dataset.s, e=+v.dataset.e;
    loopSeg(v,()=>s,()=>e);
    v.addEventListener('ended',()=>{ v.currentTime=s; v.play().catch(()=>{}); });
    v.addEventListener('loadedmetadata',()=>{ v.currentTime=s; }); });
  feedObs=new IntersectionObserver(es=>{ es.forEach(x=>{ const v=x.target; if(x.isIntersecting){ if(v.readyState<1){ v.load(); } const s=+v.dataset.s; if(Math.abs(v.currentTime-s)>5) v.currentTime=s; v.play().catch(()=>{}); } else { v.pause(); } }); },{rootMargin:'160px'});
  vids.forEach(v=>feedObs.observe(v));
}

/* the void */
const rnd=(a,b)=>a+Math.random()*(b-a);
function startVoid(el){
  const chips=document.querySelector(`.chips[data-void="${el.id}"]`);
  const groups=[...chips.querySelectorAll('button[data-g]')].filter(b=>b.dataset.g!=='all').map(b=>+b.dataset.g);
  const items=VD.items.map((it,i)=>({g:it[0],a:it[1],x:it[2],y:it[3],w:it[4],h:it[5],i})).filter(it=>groups.includes(it.g));
  const field=$('.field',el);
  const vw=el.clientWidth, vh=el.clientHeight;
  const FW=Math.max(vw*2, Math.sqrt(items.length)*230), FH=Math.max(vh*2, FW*0.62);
  field.style.width=FW+'px'; field.style.height=FH+'px';
  const ATL=VD.cell*VD.per;
  let html='';
  for(const it of items){
    const long=rnd(64,180), sc=long/Math.max(it.w,it.h), dw=it.w*sc, dh=it.h*sc, hs=Math.min(4.5,Math.max(2,380/long));
    const bs=(ATL*sc).toFixed(1)+'px', bp=`${(-it.x*sc).toFixed(1)}px ${(-it.y*sc).toFixed(1)}px`;
    html+=`<div class="v" data-i="${it.i}" style="left:${rnd(2,98).toFixed(2)}%;top:${rnd(2,98).toFixed(2)}%;width:${dw.toFixed(1)}px;height:${dh.toFixed(1)}px;background-image:url(atlas/b${it.a}.jpg);background-size:${bs};background-position:${bp};opacity:${rnd(.45,.9).toFixed(2)};--hs:${hs.toFixed(2)};--dur:${rnd(14,30).toFixed(0)}s;--dx:${rnd(-18,18).toFixed(0)}px;--dy:${rnd(-18,18).toFixed(0)}px"><div class="s" style="background-image:url(atlas/s${it.a}.jpg);background-size:${bs};background-position:${bp}"></div></div>`;
  }
  field.innerHTML=html;
  const cnt=$('.cnt',chips); const upd=()=>{ cnt.textContent=field.querySelectorAll('.v:not(.hide)').length; };
  upd();
  chips.onclick=ev=>{ const b=ev.target.closest('button[data-g]'); if(!b||b.dataset.g==='all') return; b.classList.toggle('on'); const on=new Set([...chips.querySelectorAll('button.on')].map(x=>+x.dataset.g)); field.querySelectorAll('.v').forEach(v=>{ v.classList.toggle('hide', !on.has(VD.items[+v.dataset.i][0])); }); upd(); };
  if (matchMedia('(hover: none)').matches) return;
  // parallax pan with the pointer
  let tx=-(FW-vw)/2, ty=-(FH-vh)/2, cx=tx, cy=ty;
  field.style.transform=`translate(${cx}px,${cy}px)`;
  el.onmousemove=ev=>{ const r=el.getBoundingClientRect(); const mx=(ev.clientX-r.left)/r.width, my=(ev.clientY-r.top)/r.height; tx=-mx*(FW-vw); ty=-my*(FH-vh); };
  const tick=()=>{ cx+=(tx-cx)*0.06; cy+=(ty-cy)*0.06; field.style.transform=`translate(${cx.toFixed(1)}px,${cy.toFixed(1)}px)`; voidRAF=requestAnimationFrame(tick); };
  tick();
}

/* lightbox */
const lb=$('#lb'); let lbList=[], lbI=0;
function openLB(list,i){ lbList=list; lbI=i; showLB(); lb.classList.add('open'); lb.setAttribute('aria-hidden','false'); document.body.style.overflow='hidden'; }
function showLB(){ const e=lbList[lbI]; const im=$('img',lb); im.src=e.src; im.alt=e.cap||''; $('.cap',lb).textContent=(e.cap?e.cap+'  ·  ':'')+`${lbI+1}/${lbList.length}`; }
function closeLB(){ lb.classList.remove('open'); lb.setAttribute('aria-hidden','true'); document.body.style.overflow=''; }
document.addEventListener('click',ev=>{
  const im=ev.target.closest('img[data-lb]'); if(im){ const [k,i]=im.dataset.lb.split(':'); openLB(D[k],+i); return; }
  const v=ev.target.closest('.v'); if(v){ v.classList.add('on'); setTimeout(()=>v.classList.remove('on'),1600); return; }
  if(ev.target.closest('.lb .x')) closeLB();
  const a=ev.target.closest('.lb .arr'); if(a){ lbI=(lbI+ +a.dataset.d+lbList.length)%lbList.length; showLB(); }
  else if(ev.target===lb) closeLB();
});
document.addEventListener('keydown',ev=>{ if(!lb.classList.contains('open')) return; if(ev.key==='Escape') closeLB(); if(ev.key==='ArrowRight'){lbI=(lbI+1)%lbList.length;showLB();} if(ev.key==='ArrowLeft'){lbI=(lbI-1+lbList.length)%lbList.length;showLB();} });

window.addEventListener('hashchange',render);
render();
</script>
